workflows:
  android-workflow:
    name: Mahadev APK
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix missing android folder
        script: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android --project-name mahadev_player --org com.mahadev
          fi
      - name: Add Internet permission
        script: |
          sed -i '' 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml || 
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk