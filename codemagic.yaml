workflows:
  android-workflow:
    name: Mahadev APK
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build
        script: |
          flutter create --project-name mahadev_player . --platforms=android
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk