workflows:
  android-workflow:
    name: Mahadev APK
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android --project-name mahadev_player --org com.mahadev
          fi
      - name: FORCE Add Internet
        script: |
          FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '' '/<application/i \
          \    <uses-permission android:name="android.permission.INTERNET" />\
          \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
          ' $FILE || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' $FILE
          cat $FILE
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk