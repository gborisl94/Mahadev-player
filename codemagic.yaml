workflows:
  android-workflow:
    name: Mahadev APK
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create android folder if missing
        script: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android --project-name mahadev_player --org com.mahadev
          fi
      - name: Add Internet Permission
        script: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' android/app/src/main/AndroidManifest.xml || true
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk