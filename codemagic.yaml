workflows:
  android-workflow:
    name: Mahadev APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Recréer le dossier android s'il manque
        script: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android --org com.mahadev --project-name mahadev_player
          fi
      - name: Récupérer les dépendances
        script: flutter pub get
      - name: Build APK release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk